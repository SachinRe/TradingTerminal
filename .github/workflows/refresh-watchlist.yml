name: Refresh Watchlist Data

# GitHub Actions cron is UTC-only and does not adjust for US daylight saving.
# Each Pacific target time below is scheduled twice — once for PST (UTC-8) and
# once for PDT (UTC-7). fetch-data.mjs checks the real Pacific clock and only
# does actual work if we're within a few minutes of a real target slot, so the
# "wrong" one of each pair is a no-op that exits in a couple seconds.
#
# Targets: 4:00am, 5:30am, 10:30am, 2:00pm Pacific
on:
  schedule:
    - cron: '0 12 * * *'   # 4:00am PST
    - cron: '0 11 * * *'   # 4:00am PDT
    - cron: '30 13 * * *'  # 5:30am PST
    - cron: '30 12 * * *'  # 5:30am PDT
    - cron: '30 18 * * *'  # 10:30am PST
    - cron: '30 17 * * *'  # 10:30am PDT
    - cron: '0 22 * * *'   # 2:00pm PST
    - cron: '0 21 * * *'   # 2:00pm PDT
  workflow_dispatch: {}    # lets you trigger a manual run from the Actions tab to test

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and build watchlist data
        run: node scripts/fetch-data.mjs

      - name: Commit updated data (only if it changed)
        run: |
          git config user.name "watchlist-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/candidates.json
          git diff --cached --quiet || git commit -m "chore: scheduled watchlist refresh"
          git push
