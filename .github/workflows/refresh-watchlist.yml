name: Refresh Watchlist Data

# GitHub Actions cron is UTC-only and does not adjust for US daylight saving.
# Each Pacific target time below is scheduled twice — once for PST (UTC-8) and
# once for PDT (UTC-7). fetch-data.mjs checks the real Pacific clock and only
# does actual work if we're within a few minutes of a real target slot, so the
# "wrong" one of each pair is a no-op that exits in a couple seconds.
#
# Targets: 4:00am, 5:30am, 10:30am, 2:00pm Pacific
on:
  schedule:
    - cron: '7 12 * * *'    # 4:00am PST (was '0 12 * * *')
    - cron: '7 11 * * *'    # 4:00am PDT (was '0 11 * * *')
    - cron: '37 13 * * *'   # 5:30am PST (was '30 13 * * *')
    - cron: '37 12 * * *'   # 5:30am PDT (was '30 12 * * *')
    - cron: '37 18 * * *'   # 10:30am PST (was '30 18 * * *')
    - cron: '37 17 * * *'   # 10:30am PDT (was '30 17 * * *')
    - cron: '7 22 * * *'    # 2:00pm PST (was '0 22 * * *')
    - cron: '7 21 * * *'    # 2:00pm PDT (was '0 21 * * *')
  workflow_dispatch: {}    # lets you trigger a manual run from the Actions tab to test

permissions:
  contents: write

# If two runs somehow trigger close together (a manual click near a scheduled
# time, for example), make the second one wait instead of racing the first —
# this is what was causing the "rejected / fetch first" push error.
concurrency:
  group: refresh-watchlist-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and build watchlist data
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: node scripts/fetch-data.mjs

      - name: Commit updated data (only if it changed)
        run: |
          git config user.name "watchlist-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/candidates.json
          git diff --cached --quiet || git commit -m "chore: scheduled watchlist refresh"
          # Sync with any commit that landed while this run was working,
          # preferring our freshly-generated data on conflict, then push.
          git pull --rebase -X ours origin HEAD || true
          git push
